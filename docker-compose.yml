version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: depo_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-depo_stock}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/depo_stock_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-depo_stock}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: depo_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-SUPER_SECRET_KEY_CAMBIAR_EN_PRODUCCION}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-depo_stock}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
