services:
  - type: web
    name: depo-stock
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: depo-db
          property: connectionString

databases:
  - name: depo-db
    databaseName: depo_stock
    user: postgres
